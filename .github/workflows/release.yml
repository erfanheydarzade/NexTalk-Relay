name: Release

# Releases are created from this workflow only.
# The workflow verifies the selected main commit with GitHub (signature),
# validates the Workers, the Go bridge and the browser (.wasm) extension,
# creates a DRAFT release targeting that commit, builds and verifies the
# installable .ntx courier transport bundles (6 native + 1 browser),
# uploads every asset, then publishes the release.
#
# This workflow supersedes wasm-extension.yml: every check from it
# (syntax, ABI v1 conformance tests, build, reproducibility, package
# contents) now runs here, and the artifact upload is kept.
#
# Do not push release tags manually. With GitHub release immutability enabled,
# a published tag is permanently bound to its release and cannot be reused.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.4.0 or v1.4.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Mark this as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    timeout-minutes: 20

    steps:
      - name: Validate version and release branch
        shell: bash
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Releases must be cut from main. Selected ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $TAG"
            echo "::error::Expected v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture validated commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Validated commit: $SHA"

      - name: Verify commit with GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          verification="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" \
            --jq '.commit.verification')"

          verified="$(jq -r '.verified' <<< "$verification")"
          reason="$(jq -r '.reason' <<< "$verification")"

          if [[ "$verified" != "true" ]]; then
            echo "::error::Commit $SHA is not verified by GitHub (reason: $reason)."
            echo "::error::Releases must be cut from a signed, GitHub-verified commit."
            exit 1
          fi

          echo "Commit $SHA is verified by GitHub (reason: $reason)."

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: transports/nextalk-relay/go.sum

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4.141.0
          wrangler --version

      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check shard/worker.js
          node --check router/router.js
          node --check combined/worker.js

      - name: Dry-run Worker deployments
        shell: bash
        run: |
          set -euo pipefail

          for worker in shard router combined; do
            echo
            echo "==> Dry-run: $worker"

            (
              cd "$worker"
              cp wrangler.toml.example wrangler.toml
              wrangler deploy --dry-run --outdir "$RUNNER_TEMP/${worker}-build"
              rm -f wrangler.toml
            )
          done

      - name: Verify Worker dry-runs left no worktree changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Worker validation modified the Git worktree."
            git status --short
            exit 1
          fi

      - name: WASM extension - syntax check
        working-directory: transports
        shell: bash
        run: |
          set -euo pipefail
          for f in build-wasm.mjs tools/*.mjs test/*.mjs */wasm/build.mjs; do
            node --check "$f"
          done

      - name: WASM extension - tests (ABI v1 conformance, sandbox, policy, reproducibility)
        working-directory: transports
        shell: bash
        run: |
          set -euo pipefail
          node --test test/wasm-package.test.mjs

      - name: WASM extension - build twice and require byte-identical output
        working-directory: transports
        shell: bash
        run: |
          set -euo pipefail

          node build-wasm.mjs --out "$RUNNER_TEMP/wasm-check-1"
          node build-wasm.mjs --out "$RUNNER_TEMP/wasm-check-2"

          diff -r "$RUNNER_TEMP/wasm-check-1" "$RUNNER_TEMP/wasm-check-2"
          echo "WASM build is reproducible."

          for p in "$RUNNER_TEMP"/wasm-check-1/*.ntx; do
            echo "== $p"
            unzip -tq "$p"
            test "$(unzip -Z1 "$p" | wc -l)" -eq 2
            unzip -Z1 "$p" | grep -qx manifest.json
            unzip -Z1 "$p" | grep -q '\.wasm$'
          done

      - name: Validate bridge module
        working-directory: transports/nextalk-relay
        shell: bash
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail

          go mod download
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan Go bridge for known vulnerabilities
        working-directory: transports/nextalk-relay
        env:
          GOFLAGS: -mod=readonly
        run: govulncheck ./...

  release:
    name: Build and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      TAG: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_SHA: ${{ needs.validate.outputs.commit_sha }}
      GO_VERSION: "1.25.14"

    steps:
      - name: Checkout validated release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Verify validated release commit
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [[ "$ACTUAL_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::Checked out commit does not match the validated commit."
            echo "::error::Expected: $RELEASE_SHA"
            echo "::error::Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "Using validated commit: $RELEASE_SHA"

      - name: Re-verify release commit with GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          verification="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}" \
            --jq '.commit.verification')"

          verified="$(jq -r '.verified' <<< "$verification")"
          reason="$(jq -r '.reason' <<< "$verification")"

          if [[ "$verified" != "true" ]]; then
            echo "::error::Commit $RELEASE_SHA is not verified by GitHub (reason: $reason)."
            exit 1
          fi

          echo "Commit $RELEASE_SHA is verified by GitHub (reason: $reason)."

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
          cache-dependency-path: transports/nextalk-relay/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: false

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4.141.0
          wrangler --version

      - name: Prepare draft GitHub release
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NOTES="Cloudflare Workers relay release with installable NexTalk .ntx courier transport bundles (native and browser .wasm)."

          if release_json="$(gh release view "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isImmutable,tagName,targetCommitish,url 2>/dev/null)"; then

            is_draft="$(jq -r '.isDraft' <<< "$release_json")"
            is_immutable="$(jq -r '.isImmutable' <<< "$release_json")"

            if [[ "$is_draft" != "true" || "$is_immutable" == "true" ]]; then
              echo "::error::Release $TAG already exists as a published or immutable release."
              echo "::error::Immutable release versions are one-shot. Use a new version."
              exit 1
            fi

            echo "Reusing existing draft release $TAG."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
              TAG_SHA="$(git rev-list -n 1 "$TAG")"

              if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
                echo "::error::Tag $TAG already exists at a different commit."
                echo "::error::Tag commit:     $TAG_SHA"
                echo "::error::Release commit: $RELEASE_SHA"
                exit 1
              fi

              echo "Creating draft release for existing tag $TAG."
              gh release create "$TAG" \
                --repo "${GITHUB_REPOSITORY}" \
                --draft \
                --verify-tag \
                --title "NexTalk-Relay $TAG" \
                --notes "$NOTES" \
                --generate-notes
            else
              echo "Creating draft release $TAG at $RELEASE_SHA."
              gh release create "$TAG" \
                --repo "${GITHUB_REPOSITORY}" \
                --draft \
                --target "$RELEASE_SHA" \
                --title "NexTalk-Relay $TAG" \
                --notes "$NOTES" \
                --generate-notes
            fi

            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify draft release target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_json="$(gh release view "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isImmutable,tagName,targetCommitish)"

          jq -e \
            --arg tag "$TAG" \
            --arg sha "$RELEASE_SHA" \
            '
              .isDraft == true
              and .isImmutable == false
              and .tagName == $tag
              and .targetCommitish == $sha
            ' <<< "$release_json" >/dev/null

          echo "Verified draft release $TAG targets $RELEASE_SHA."

      - name: Prepare release artifact directory
        shell: bash
        run: |
          set -euo pipefail

          export NTX_DIST="$RUNNER_TEMP/nextalk-relay-ntx"
          echo "NTX_DIST=$NTX_DIST" >> "$GITHUB_ENV"

          rm -rf "$NTX_DIST"
          mkdir -p "$NTX_DIST"

      - name: Build six native .ntx courier bundles
        working-directory: transports/nextalk-relay
        shell: bash
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          rm -rf "$NTX_DIST"
          mkdir -p "$NTX_DIST"

          build_ntx() {
            local goos="$1"
            local goarch="$2"
            local goarm="${3:-}"
            local entry="nextalk-relay-bridge"
            local manifest="manifest.json"

            if [[ "$goos" == "windows" ]]; then
              entry="nextalk-relay-bridge.exe"
              manifest="manifest.windows.json"
            fi

            echo
            echo "==> Building $goos/$goarch${goarm:+v$goarm}"

            rm -f "$entry"
            rm -rf .ntx-stage
            mkdir -p .ntx-stage

            if [[ -n "$goarm" ]]; then
              GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o "$entry" ./bridge
            else
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o "$entry" ./bridge
            fi

            test -s "$entry"

            jq --arg version "$VERSION" \
              '.version = $version' \
              "$manifest" \
              > .ntx-stage/manifest.json

            jq -e \
              --arg version "$VERSION" \
              --arg id "nextalk-relay" \
              --arg entry "$entry" \
              '
                .id == $id
                and .version == $version
                and .api_version == "1"
                and .entry == $entry
                and (.capabilities | index("message")) != null
              ' \
              .ntx-stage/manifest.json >/dev/null

            cp "$entry" .ntx-stage/

            SUFFIX="${goos}_${goarch}${goarm:+v$goarm}"
            OUT="$NTX_DIST/nextalk-relay_${VERSION}_${SUFFIX}.ntx"

            (
              cd .ntx-stage
              zip -q -j "$OUT" manifest.json "$entry"
            )

            test -s "$OUT"
            unzip -tq "$OUT"

            unzip -p "$OUT" manifest.json \
              | jq -e \
                  --arg version "$VERSION" \
                  --arg entry "$entry" \
                  '.version == $version and .entry == $entry' \
                >/dev/null

            unzip -l "$OUT" | grep -Eq '[[:space:]]manifest\.json$'
            unzip -l "$OUT" | grep -Eq "[[:space:]]${entry//./\.}$"

            rm -rf .ntx-stage "$entry"

            echo "Packaged: $OUT"
          }

          build_ntx linux amd64
          build_ntx linux arm64
          build_ntx linux arm 7
          build_ntx darwin amd64
          build_ntx darwin arm64
          build_ntx windows amd64

          count="$(find "$NTX_DIST" -maxdepth 1 -type f -name '*.ntx' | wc -l)"
          if [[ "$count" -ne 6 ]]; then
            echo "::error::Expected exactly 6 native .ntx bundles, found $count."
            find "$NTX_DIST" -maxdepth 1 -type f -print
            exit 1
          fi

          echo
          echo "==> Six native .ntx bundles verified:"
          ls -lh "$NTX_DIST"

      - name: Build and verify browser (.wasm) extension
        working-directory: transports
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          WASM_TMP="$RUNNER_TEMP/wasm-dist"
          WASM_TMP2="$RUNNER_TEMP/wasm-dist-repro"

          node build-wasm.mjs --version "$VERSION" --out "$WASM_TMP"

          # Reproducibility: a second build must be byte-identical.
          node build-wasm.mjs --version "$VERSION" --out "$WASM_TMP2"
          diff -r "$WASM_TMP" "$WASM_TMP2"
          echo "WASM build is reproducible."

          OUT="$NTX_DIST/nextalk-relay-wasm_${VERSION}_browser.ntx"
          cp "$WASM_TMP/nextalk-relay-wasm.ntx" "$OUT"

          # Package contents are exactly manifest.json + the .wasm entry.
          test -s "$OUT"
          unzip -tq "$OUT"
          test "$(unzip -Z1 "$OUT" | wc -l)" -eq 2
          unzip -Z1 "$OUT" | grep -qx 'manifest.json'
          unzip -Z1 "$OUT" | grep -qx 'nextalk-relay.wasm'

          unzip -p "$OUT" manifest.json \
            | jq -e --arg version "$VERSION" '
                .id == "nextalk-relay-wasm"
                and .version == $version
                and .api_version == "1"
                and .entry == "nextalk-relay.wasm"
                and (.permissions | length) == 0
              ' >/dev/null

          # Keep the build's own checksums for the run artifact.
          if [[ -f "$WASM_TMP/SHA256SUMS" ]]; then
            cp "$WASM_TMP/SHA256SUMS" "$RUNNER_TEMP/wasm-SHA256SUMS"
            echo "WASM_SUMS=$RUNNER_TEMP/wasm-SHA256SUMS" >> "$GITHUB_ENV"
          fi

          echo "Packaged: $OUT"

      - name: Generate and verify .ntx checksums
        shell: bash
        run: |
          set -euo pipefail

          cd "$NTX_DIST"

          sha256sum nextalk-relay_*.ntx nextalk-relay-wasm_*.ntx > nextalk-relay_checksums.txt
          sha256sum -c nextalk-relay_checksums.txt

          test -s nextalk-relay_checksums.txt
          # six native bundles + the browser (.wasm) bundle
          test "$(wc -l < nextalk-relay_checksums.txt)" -eq 7

      - name: Final source sanity check
        shell: bash
        run: |
          set -euo pipefail

          node --check shard/worker.js
          node --check router/router.js
          node --check combined/worker.js

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Release build modified the source worktree."
            git status --short
            exit 1
          fi

      - name: Upload .ntx bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextalk-relay-ntx
          path: |
            ${{ env.NTX_DIST }}/*.ntx
            ${{ env.NTX_DIST }}/nextalk-relay_checksums.txt
          if-no-files-found: error

      - name: Generate .ntx artifact attestation
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ env.NTX_DIST }}/nextalk-relay_checksums.txt

      - name: Upload .ntx assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          assets=(
            "$NTX_DIST/nextalk-relay_${TAG#v}_linux_amd64.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_linux_arm64.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_linux_armv7.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_darwin_amd64.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_darwin_arm64.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_windows_amd64.ntx"
            "$NTX_DIST/nextalk-relay-wasm_${TAG#v}_browser.ntx"
            "$NTX_DIST/nextalk-relay_checksums.txt"
          )

          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          gh release upload "$TAG" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Verify draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t actual < <(
            gh release view "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isImmutable,tagName,targetCommitish,assets \
              --jq '.assets[].name' \
              | sort
          )

          expected=(
            "nextalk-relay_${TAG#v}_darwin_amd64.ntx"
            "nextalk-relay_${TAG#v}_darwin_arm64.ntx"
            "nextalk-relay_${TAG#v}_linux_amd64.ntx"
            "nextalk-relay_${TAG#v}_linux_arm64.ntx"
            "nextalk-relay_${TAG#v}_linux_armv7.ntx"
            "nextalk-relay_${TAG#v}_windows_amd64.ntx"
            "nextalk-relay-wasm_${TAG#v}_browser.ntx"
            "nextalk-relay_checksums.txt"
          )

          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          printf '%s\n' "${actual[@]}" > "$RUNNER_TEMP/actual-assets.txt"

          if ! diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::Draft release assets do not match the exact expected set."
            exit 1
          fi

          echo "Verified exactly ${#actual[@]} release assets."

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease
          else
            gh release edit "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease=false
          fi

          echo "Published $TAG"

      - name: Verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_json="$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json isDraft,isImmutable,isPrerelease,tagName,targetCommitish,assets,url)"

          jq -e --arg tag "$TAG" --arg sha "$RELEASE_SHA" --argjson prerelease "$PRERELEASE" '
              .isDraft == false
              and .isImmutable == true
              and .tagName == $tag
              and .targetCommitish == $sha
              and .isPrerelease == $prerelease
              and (.assets | length) == 8
            ' <<< "$release_json" >/dev/null

          echo "Immutable release verified:"
          jq -r '"\(.url)\nassets=\(.assets | length)\ntarget=\(.targetCommitish)"' <<< "$release_json"

      - name: Verify GitHub release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release verify "$TAG" --repo "${GITHUB_REPOSITORY}"

      - name: Cleanup draft release after failure
        if: ${{ (failure() || cancelled()) && steps.prepare.outputs.created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          release_json="$(gh release view "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isImmutable 2>/dev/null)"

          if [[ -z "$release_json" ]]; then
            echo "Release $TAG is not readable; leaving state untouched."
            exit 0
          fi

          is_draft="$(jq -r '.isDraft' <<< "$release_json")"
          is_immutable="$(jq -r '.isImmutable' <<< "$release_json")"

          if [[ "$is_draft" == "true" && "$is_immutable" != "true" ]]; then
            echo "Cleaning up draft release $TAG."
            # Publishing creates a new tag for a draft release when needed.
            # Never delete a pre-existing tag as part of draft cleanup.
            gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes || true
          else
            echo "Release $TAG is published or immutable; refusing destructive cleanup."
          fi