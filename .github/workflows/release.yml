name: Release

# Releases are created from this workflow only.
# The workflow creates a DRAFT release (and its tag) on the selected main
# commit, builds and verifies the Workers plus the installable .ntx courier
# transport bundles, uploads every asset, then publishes the release.
#
# Do not push release tags manually. With GitHub release immutability enabled,
# a published tag is permanently bound to its release and cannot be reused.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.4.0 or v1.4.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Mark this as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    timeout-minutes: 20

    steps:
      - name: Validate version and release branch
        shell: bash
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Releases must be cut from main. Selected ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $TAG"
            echo "::error::Expected v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture validated commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Validated commit: $SHA"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: transports/nextalk-relay/go.sum

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4.141.0
          wrangler --version

      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check shard/worker.js
          node --check router/router.js
          node --check combined/worker.js

      - name: Dry-run Worker deployments
        shell: bash
        run: |
          set -euo pipefail

          for worker in shard router combined; do
            echo
            echo "==> Dry-run: $worker"

            (
              cd "$worker"
              cp wrangler.toml.example wrangler.toml

              case "$worker" in
                shard)
                  wrangler deploy --dry-run --outdir "$RUNNER_TEMP/shard-build"
                  ;;
                router)
                  wrangler deploy --dry-run --outdir "$RUNNER_TEMP/router-build"
                  ;;
                combined)
                  wrangler deploy --dry-run --outdir "$RUNNER_TEMP/combined-build"
                  ;;
              esac

              rm -f wrangler.toml
            )
          done

      - name: Verify Worker dry-runs left no worktree changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Worker validation modified the Git worktree."
            git status --short
            exit 1
          fi

      - name: Validate bridge module
        working-directory: transports/nextalk-relay
        shell: bash
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail

          go mod download
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1

  release:
    name: Build and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      TAG: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_SHA: ${{ needs.validate.outputs.commit_sha }}
      GO_VERSION: "1.25.14"

    steps:
      - name: Checkout validated release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
          cache-dependency-path: transports/nextalk-relay/go.sum

      - name: Verify validated release commit
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [[ "$ACTUAL_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::Checked out commit does not match the validated commit."
            echo "::error::Expected: $RELEASE_SHA"
            echo "::error::Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "Using validated commit: $RELEASE_SHA"

      - name: Prepare draft GitHub release
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if release_json="$(gh release view "$TAG"             --repo "${GITHUB_REPOSITORY}"             --json isDraft,isImmutable,tagName,targetCommitish,url 2>/dev/null)"; then

            is_draft="$(jq -r '.isDraft' <<< "$release_json")"
            is_immutable="$(jq -r '.isImmutable' <<< "$release_json")"

            if [[ "$is_draft" != "true" || "$is_immutable" == "true" ]]; then
              echo "::error::Release $TAG already exists as a published or immutable release."
              echo "::error::Immutable release versions are one-shot. Use a new version."
              exit 1
            fi

            echo "Reusing existing draft release $TAG."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
              TAG_SHA="$(git rev-list -n 1 "$TAG")"

              if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
                echo "::error::Tag $TAG already exists at a different commit."
                echo "::error::Tag commit:     $TAG_SHA"
                echo "::error::Release commit: $RELEASE_SHA"
                exit 1
              fi

              echo "Creating draft release for existing tag $TAG."
              gh release create "$TAG"                 --repo "${GITHUB_REPOSITORY}"                 --draft                 --verify-tag                 --title "NexTalk-Relay $TAG"                 --notes "Cloudflare Workers relay release with installable NexTalk .ntx courier transport bundles."                 --generate-notes
            else
              echo "Creating draft release $TAG at $RELEASE_SHA."
              gh release create "$TAG"                 --repo "${GITHUB_REPOSITORY}"                 --draft                 --target "$RELEASE_SHA"                 --title "NexTalk-Relay $TAG"                 --notes "Cloudflare Workers relay release with installable NexTalk .ntx courier transport bundles."                 --generate-notes
            fi

            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve and verify release tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin --force
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"

          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"

          if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag $TAG does not point to the workflow commit."
            echo "::error::Tag SHA:      $TAG_SHA"
            echo "::error::Commit SHA:   $RELEASE_SHA"
            exit 1
          fi

          echo "Verified $TAG -> $RELEASE_SHA"

      - name: Prepare release artifact directory
        shell: bash
        run: |
          set -euo pipefail

          export NTX_DIST="$RUNNER_TEMP/nextalk-relay-ntx"
          echo "NTX_DIST=$NTX_DIST" >> "$GITHUB_ENV"

          rm -rf "$NTX_DIST"
          mkdir -p "$NTX_DIST"

      - name: Build six .ntx courier bundles
        working-directory: transports/nextalk-relay
        shell: bash
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          rm -rf "$NTX_DIST"
          mkdir -p "$NTX_DIST"

          build_ntx() {
            local goos="$1"
            local goarch="$2"
            local goarm="${3:-}"
            local entry="nextalk-relay-bridge"
            local manifest="manifest.json"

            if [[ "$goos" == "windows" ]]; then
              entry="nextalk-relay-bridge.exe"
              manifest="manifest.windows.json"
            fi

            echo
            echo "==> Building $goos/$goarch${goarm:+v$goarm}"

            rm -f "$entry"
            rm -rf .ntx-stage
            mkdir -p .ntx-stage

            if [[ -n "$goarm" ]]; then
              GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0                 go build -trimpath -ldflags="-s -w" -o "$entry" ./bridge
            else
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0                 go build -trimpath -ldflags="-s -w" -o "$entry" ./bridge
            fi

            test -s "$entry"

            jq --arg version "$VERSION"               '.version = $version'               "$manifest"               > .ntx-stage/manifest.json

            jq -e               --arg version "$VERSION"               --arg id "nextalk-relay"               --arg entry "$entry"               '
                .id == $id
                and .version == $version
                and .api_version == "1"
                and .entry == $entry
                and (.capabilities | index("message")) != null
              '               .ntx-stage/manifest.json >/dev/null

            cp "$entry" .ntx-stage/

            SUFFIX="${goos}_${goarch}${goarm:+v$goarm}"
            OUT="$NTX_DIST/nextalk-relay_${VERSION}_${SUFFIX}.ntx"

            (
              cd .ntx-stage
              zip -q -j "$OUT" manifest.json "$entry"
            )

            test -s "$OUT"
            unzip -tq "$OUT"

            unzip -p "$OUT" manifest.json               | jq -e                   --arg version "$VERSION"                   --arg entry "$entry"                   '.version == $version and .entry == $entry'               >/dev/null

            unzip -l "$OUT" | grep -Eq '[[:space:]]manifest\.json$'
            unzip -l "$OUT" | grep -Eq "[[:space:]]${entry//./\.}$"

            rm -rf .ntx-stage "$entry"

            echo "Packaged: $OUT"
          }

          build_ntx linux amd64
          build_ntx linux arm64
          build_ntx linux arm 7
          build_ntx darwin amd64
          build_ntx darwin arm64
          build_ntx windows amd64

          count="$(find "$NTX_DIST" -maxdepth 1 -type f -name '*.ntx' | wc -l)"
          if [[ "$count" -ne 6 ]]; then
            echo "::error::Expected exactly 6 .ntx bundles, found $count."
            find "$NTX_DIST" -maxdepth 1 -type f -print
            exit 1
          fi

          echo
          echo "==> Six .ntx bundles verified:"
          ls -lh "$NTX_DIST"

      - name: Generate and verify .ntx checksums
        shell: bash
        run: |
          set -euo pipefail

          cd "$NTX_DIST"

          sha256sum nextalk-relay_*.ntx > nextalk-relay_checksums.txt
          sha256sum -c nextalk-relay_checksums.txt

          test -s nextalk-relay_checksums.txt
          test "$(wc -l < nextalk-relay_checksums.txt)" -eq 6

      - name: Install pinned Wrangler
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: false

      - name: Install Wrangler CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4.141.0
          wrangler --version

      - name: Final source sanity check
        shell: bash
        run: |
          set -euo pipefail

          node --check shard/worker.js
          node --check router/router.js
          node --check combined/worker.js

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Release build modified the source worktree."
            git status --short
            exit 1
          fi

      - name: Generate .ntx artifact attestation
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ env.NTX_DIST }}/nextalk-relay_checksums.txt

      - name: Upload .ntx assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          assets=(
            "$NTX_DIST/nextalk-relay_${TAG#v}_linux_amd64.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_linux_arm64.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_linux_armv7.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_darwin_amd64.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_darwin_arm64.ntx"
            "$NTX_DIST/nextalk-relay_${TAG#v}_windows_amd64.ntx"
            "$NTX_DIST/nextalk-relay_checksums.txt"
          )

          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          gh release upload "$TAG" "${assets[@]}"             --repo "${GITHUB_REPOSITORY}"             --clobber

      - name: Verify draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t actual < <(
            gh release view "$TAG"               --repo "${GITHUB_REPOSITORY}"               --json isDraft,isImmutable,tagName,targetCommitish,assets               --jq '.assets[].name'               | sort
          )

          expected=(
            "nextalk-relay_${TAG#v}_darwin_amd64.ntx"
            "nextalk-relay_${TAG#v}_darwin_arm64.ntx"
            "nextalk-relay_${TAG#v}_linux_amd64.ntx"
            "nextalk-relay_${TAG#v}_linux_arm64.ntx"
            "nextalk-relay_${TAG#v}_linux_armv7.ntx"
            "nextalk-relay_${TAG#v}_windows_amd64.ntx"
            "nextalk-relay_checksums.txt"
          )

          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          printf '%s\n' "${actual[@]}" > "$RUNNER_TEMP/actual-assets.txt"

          if ! diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::Draft release assets do not match the exact expected set."
            exit 1
          fi

          echo "Verified exactly ${#actual[@]} release assets."

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG"               --repo "${GITHUB_REPOSITORY}"               --draft=false               --prerelease
          else
            gh release edit "$TAG"               --repo "${GITHUB_REPOSITORY}"               --draft=false               --prerelease=false
          fi

          echo "Published $TAG"

      - name: Verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_json="$(gh release view "$TAG"             --repo "${GITHUB_REPOSITORY}"             --json isDraft,isImmutable,isPrerelease,tagName,targetCommitish,assets,url)"

          jq -e             --arg tag "$TAG"             --arg sha "$RELEASE_SHA"             --argjson prerelease "$PRERELEASE"             '
              .isDraft == false
              and .isImmutable == true
              and .tagName == $tag
              and .targetCommitish == $sha
              and .isPrerelease == $prerelease
            '             <<< "$release_json" >/dev/null

          echo "Immutable release verified:"
          jq -r '"\(.url)\nassets=\(.assets | length)\ntarget=\(.targetCommitish)"' <<< "$release_json"

      - name: Cleanup draft release after failure
        if: ${{ (failure() || cancelled()) && steps.prepare.outputs.created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          release_json="$(gh release view "$TAG"             --repo "${GITHUB_REPOSITORY}"             --json isDraft,isImmutable 2>/dev/null)"

          if [[ -z "$release_json" ]]; then
            echo "Release $TAG is not readable; leaving state untouched."
            exit 0
          fi

          is_draft="$(jq -r '.isDraft' <<< "$release_json")"
          is_immutable="$(jq -r '.isImmutable' <<< "$release_json")"

          if [[ "$is_draft" == "true" && "$is_immutable" != "true" ]]; then
            echo "Cleaning up draft release $TAG and its tag."
            gh release delete "$TAG"               --repo "${GITHUB_REPOSITORY}"               --yes               --cleanup-tag || true
          else
            echo "Release $TAG is published or immutable; refusing destructive cleanup."
          fi
